name: Build APK

on:
  push:
    branches: [ main ]
    # 纯文档提交不触发构建：避免同版本号 tag 重复发布
    paths-ignore:
      - '**.md'
  workflow_dispatch:

permissions:
  contents: write

env:
  APP_VERSION_NAME: 2.8.7
  APP_VERSION_TAG: v2.8.7

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4

      # 固定签名：从 secrets 恢复 keystore，保证每个版本签名一致、可覆盖安装
      - name: Restore signing keystore
        run: |
          echo "${{ secrets.DQ_KEYSTORE_B64 }}" | base64 -d > "$RUNNER_TEMP/dronequiz.keystore"
          echo "DQ_KS_PATH=$RUNNER_TEMP/dronequiz.keystore" >> "$GITHUB_ENV"
          echo "DQ_KS_STORE_PASS=${{ secrets.DQ_KS_STORE_PASS }}" >> "$GITHUB_ENV"

      - name: Build release APK
        run: ./gradlew assembleRelease --stacktrace --no-daemon

      - name: Rename APK
        run: |
          mkdir -p dist
          cp app/build/outputs/apk/release/app-release.apk dist/DroneQuiz-${{ env.APP_VERSION_NAME }}.apk

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: DroneQuiz-${{ env.APP_VERSION_NAME }}
          path: dist/DroneQuiz-${{ env.APP_VERSION_NAME }}.apk

      - name: Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ env.APP_VERSION_TAG }}
          name: DroneQuiz ${{ env.APP_VERSION_TAG }}
          files: dist/DroneQuiz-${{ env.APP_VERSION_NAME }}.apk
          body: |
            题屿 v2.8.7 —— 防沉迷更名 + 题库重命名 + 错题本删除动画 + 小字自适应背景
            
            【设置 · 防沉迷】
            - 「护眼提醒」正式更名为「防沉迷」；
            - 全部设置项的说明文字统一压缩到 10 字左右（最长不超 15 字），不再换行。
            
            【题库 · 重命名】
            - 设置 → 题库管理，每个题库行新增铅笔按钮，点开即可重命名（最长 16 字，空名不改）。
            
            【错题本 · 删除体验】
            - 删除按钮改为 30dp 大触达区并左移，不再和右侧滚动把手贴身、好点多了；
            - 把手拖动轨道收窄，列表右缘点击不再被吞；
            - 删除错题有动画了：当前条目缩放淡出，其余条目弹性靠拢补位。
            
            【小字 · 自适应背景】
            - 各页面的分区标题、页面副标题、页脚提示等灰色小字随壁纸明暗自适应：
              壁纸偏暗自动提亮、偏亮自动压深，深色壁纸上看不清的问题解决了。
            
            固定签名，可直接覆盖安装 v2.x
