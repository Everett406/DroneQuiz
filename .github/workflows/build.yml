name: Build APK

on:
  push:
    branches: [ main ]
  workflow_dispatch:

permissions:
  contents: write

env:
  APP_VERSION_NAME: 2.7.2
  APP_VERSION_TAG: v2.7.2

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4

      # 固定签名：从 secrets 恢复 keystore，保证每个版本签名一致、可覆盖安装
      - name: Restore signing keystore
        run: |
          echo "${{ secrets.DQ_KEYSTORE_B64 }}" | base64 -d > "$RUNNER_TEMP/dronequiz.keystore"
          echo "DQ_KS_PATH=$RUNNER_TEMP/dronequiz.keystore" >> "$GITHUB_ENV"
          echo "DQ_KS_STORE_PASS=${{ secrets.DQ_KS_STORE_PASS }}" >> "$GITHUB_ENV"

      - name: Build release APK
        run: ./gradlew assembleRelease --stacktrace --no-daemon

      - name: Rename APK
        run: |
          mkdir -p dist
          cp app/build/outputs/apk/release/app-release.apk dist/DroneQuiz-${{ env.APP_VERSION_NAME }}.apk

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: DroneQuiz-${{ env.APP_VERSION_NAME }}
          path: dist/DroneQuiz-${{ env.APP_VERSION_NAME }}.apk

      - name: Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ env.APP_VERSION_TAG }}
          name: DroneQuiz ${{ env.APP_VERSION_TAG }}
          files: dist/DroneQuiz-${{ env.APP_VERSION_NAME }}.apk
          body: |
            无人机装调题库刷题 APP v2.7.2 —— 羽化砍除 + 滚动条重做 + 刷题进度修复 + 内置阅读字体

            【顶部羽化正式砍除】(听你的)
            - 五版迭代后你裁定"还是失败了，砍掉这个吧"——正式下线：
              内容滚出即在顶部干净直切，无蒙版/无离屏/无渐变，永不再折腾;
            - 答题卡题号网格的上下柔化不受影响(纯色格子，无此问题)

            【错题本滚动把手 v3】(齿轮感根除)
            - 一跳一跳的真因：旧版跟随只读"第几题"(每跨一题跳一格)，
              拖动也是整题整题地跳；
            - 现全链路改像素级连续映射：跟随逐像素平滑，拖动亚题精度，
              上下滑与把手全程同步，真正像拖一个列表；
            - 样式收敛：4dp 细长胶囊低存在感，拖动时放大提亮

            【刷题进度修复】
            - "每次点开都是第一题"真因：恢复链路竞态——
              翻页保存的初始发射把进度覆写回 0；现已修复，
              顺序刷题从上次位置继续，随机刷题正常洗牌且记住本轮顺序；
            - 上一轮全部刷完自动开新一轮；
            - 配置页新增"将接续上次进度·第 N/M 题"提示与"重新开始"按钮

            【搜索与解析弹层】
            - 修复绿色选项里 ABC 字母不显示(绿底绿字同色隐形，改白字)；
            - 查看选项与解析改为弹性展开/收起动画，不再直出直隐；
            - 刷题页选项徽章同步恢复显示原字母

            【昵称输入框】
            - 光标不再顶到最右边(位置随文字起点)；
            - 输入框收窄，不再那么宽；存储层字数上限与 UI 对齐(5 字)

            【内置阅读字体】
            - 设置-外观新增"阅读字体"：系统默认/思源黑体/思源宋体/霞鹜文楷；
              切换全局即时生效，含示例行所见即所得；
            - 字体按 GB2312+题库字符集子集化，APK 增量约 17MB；OFL 许可随包附带

            【首页】
            - 总进度卡顶部留 6dp，卡片阴影不再被问候语区域裁切

            固定签名，可直接覆盖安装 v2.x
