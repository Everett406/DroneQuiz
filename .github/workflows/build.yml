name: Build APK

on:
  push:
    branches: [ main ]
  workflow_dispatch:

permissions:
  contents: write

env:
  APP_VERSION_NAME: 2.0.2
  APP_VERSION_TAG: v2.0.2

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4

      # 固定签名：从 secrets 恢复 keystore，保证每个版本签名一致、可覆盖安装
      - name: Restore signing keystore
        run: |
          echo "${{ secrets.DQ_KEYSTORE_B64 }}" | base64 -d > "$RUNNER_TEMP/dronequiz.keystore"
          echo "DQ_KS_PATH=$RUNNER_TEMP/dronequiz.keystore" >> "$GITHUB_ENV"
          echo "DQ_KS_STORE_PASS=${{ secrets.DQ_KS_STORE_PASS }}" >> "$GITHUB_ENV"

      - name: Build release APK
        run: ./gradlew assembleRelease --stacktrace --no-daemon

      - name: Rename APK
        run: |
          mkdir -p dist
          cp app/build/outputs/apk/release/app-release.apk dist/DroneQuiz-${{ env.APP_VERSION_NAME }}.apk

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: DroneQuiz-${{ env.APP_VERSION_NAME }}
          path: dist/DroneQuiz-${{ env.APP_VERSION_NAME }}.apk

      - name: Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ env.APP_VERSION_TAG }}
          name: DroneQuiz ${{ env.APP_VERSION_TAG }}
          files: dist/DroneQuiz-${{ env.APP_VERSION_NAME }}.apk
          body: |
            无人机装调题库刷题 APP v2.0.2
            - 启动守护：面包屑日志 + 启动心跳，任何形式异常退出（含渲染层 native 崩溃）下次启动自动诊断
            - 自愈能力：检测到异常退出自动进入安全模式（关闭画面特效），保证 APP 始终可用
            - 设置新增「画面特效」开关，可手动开关液态玻璃
            - 固定签名：此后所有版本可直接覆盖安装，无需再卸载旧版（本次安装仍需卸载一次旧版）
            - 修复模考交卷崩溃（wrongbook.addedAt）、真液态玻璃（Kyant0 backdrop）
          overwrite_files: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
