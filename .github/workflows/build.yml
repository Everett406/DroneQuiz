name: Build APK

on:
  push:
    branches: [ main ]
    # 纯文档提交不触发构建：避免同版本号 tag 重复发布
    paths-ignore:
      - '**.md'
  workflow_dispatch:

permissions:
  contents: write

env:
  APP_VERSION_NAME: 2.8.8
  APP_VERSION_TAG: v2.8.8

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4

      # 固定签名：从 secrets 恢复 keystore，保证每个版本签名一致、可覆盖安装
      - name: Restore signing keystore
        run: |
          echo "${{ secrets.DQ_KEYSTORE_B64 }}" | base64 -d > "$RUNNER_TEMP/dronequiz.keystore"
          echo "DQ_KS_PATH=$RUNNER_TEMP/dronequiz.keystore" >> "$GITHUB_ENV"
          echo "DQ_KS_STORE_PASS=${{ secrets.DQ_KS_STORE_PASS }}" >> "$GITHUB_ENV"

      - name: Build release APK
        run: ./gradlew assembleRelease --stacktrace --no-daemon

      - name: Rename APK
        run: |
          mkdir -p dist
          cp app/build/outputs/apk/release/app-release.apk dist/TiYu-${{ env.APP_VERSION_NAME }}.apk

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: TiYu-${{ env.APP_VERSION_NAME }}
          path: dist/TiYu-${{ env.APP_VERSION_NAME }}.apk

      - name: Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ env.APP_VERSION_TAG }}
          name: 题屿 TiYu ${{ env.APP_VERSION_TAG }}
          files: dist/TiYu-${{ env.APP_VERSION_NAME }}.apk
          body: |
            题屿 v2.8.8 —— 切库数据隔离堵漏 + 检查更新 + 仓库更名 TiYu

            【刷题 · 切库数据混乱修复】
            - 修复：导入/切换题库后，「将接续上次进度」仍显示旧题库的进度（如 523/2000）、
              点开始刷出旧题库题目、切随机变内置题库 20 道等一系列串库现象；
            - 现在所有刷题入口严格跟随当前题库：各模式进度按题库各自保存，
              切回旧题库时原进度仍在，不丢数据。

            【关于 · 检查更新】
            - 设置 → 关于，新增「检查更新」：自动比对 GitHub Releases 最新版；
            - 有新版弹窗提示，一键用浏览器打开发布页下载（不做自动下载安装）；
            - 点版本行也可直达 Releases 页。

            【流畅度】
            - 修复前台使用计时每分钟触发的全局连锁重组（滚动中偶发掉帧）；
            - 修复异库旧会话引发的整库重复加载（大题库导入后更明显）。

            【仓库更名】
            - 仓库 DroneQuiz 更名为 TiYu（题屿拼音，GitHub 不支持纯中文名）；
            - 旧链接自动 301 重定向，历史发布不可 404；安装包更名为 TiYu-x.y.z.apk。

            固定签名，可直接覆盖安装 v2.x
