name: Build APK

on:
  push:
    branches: [ main ]
    # 纯文档提交不触发构建：避免同版本号 tag 重复发布
    paths-ignore:
      - '**.md'
  workflow_dispatch:

permissions:
  contents: write

env:
  APP_VERSION_NAME: 2.8.9
  APP_VERSION_TAG: v2.8.9

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4

      # 固定签名：从 secrets 恢复 keystore，保证每个版本签名一致、可覆盖安装
      - name: Restore signing keystore
        run: |
          echo "${{ secrets.DQ_KEYSTORE_B64 }}" | base64 -d > "$RUNNER_TEMP/dronequiz.keystore"
          echo "DQ_KS_PATH=$RUNNER_TEMP/dronequiz.keystore" >> "$GITHUB_ENV"
          echo "DQ_KS_STORE_PASS=${{ secrets.DQ_KS_STORE_PASS }}" >> "$GITHUB_ENV"

      - name: Build release APK
        run: ./gradlew assembleRelease --stacktrace --no-daemon

      - name: Rename APK
        run: |
          mkdir -p dist
          cp app/build/outputs/apk/release/app-release.apk dist/TiYu-${{ env.APP_VERSION_NAME }}.apk

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: TiYu-${{ env.APP_VERSION_NAME }}
          path: dist/TiYu-${{ env.APP_VERSION_NAME }}.apk

      - name: Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ env.APP_VERSION_TAG }}
          name: 题屿 TiYu ${{ env.APP_VERSION_TAG }}
          files: dist/TiYu-${{ env.APP_VERSION_NAME }}.apk
          body: |
            题屿 v2.8.9 —— 关于页弹窗化 + 检查更新提示错位修复 + 按钮等高

            【关于 · 底部弹窗化】
            - 设置 → 关于由内联卡片改为单行入口，点开从底部弹出玻璃弹窗；
            - 弹窗为文档式排版（文楷标题与正文 + 虚线分隔）：应用介绍、版本行
              （可点直达 GitHub Releases）、「请喝奶茶」与「检查更新」双胶囊。

            【修复 · 检查更新提示串位】
            - 「已是最新版本 / 检查失败」此前误写入题库管理区的提示位，
              现在只显示在关于弹窗内检查更新按钮下方。

            【修复 · 按钮换行不等高】
            - 「请作者喝杯奶茶」文案过长在小屏换行，导致与「检查更新」不等高；
              改为固定 44dp 等高胶囊 + 单行文本，文案精简为「请喝奶茶」。

            固定签名，可直接覆盖安装 v2.x
