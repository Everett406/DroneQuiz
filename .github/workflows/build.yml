name: Build APK

on:
  push:
    branches: [ main ]
  workflow_dispatch:

permissions:
  contents: write

env:
  APP_VERSION_NAME: 2.6.4
  APP_VERSION_TAG: v2.6.4

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4

      # 固定签名：从 secrets 恢复 keystore，保证每个版本签名一致、可覆盖安装
      - name: Restore signing keystore
        run: |
          echo "${{ secrets.DQ_KEYSTORE_B64 }}" | base64 -d > "$RUNNER_TEMP/dronequiz.keystore"
          echo "DQ_KS_PATH=$RUNNER_TEMP/dronequiz.keystore" >> "$GITHUB_ENV"
          echo "DQ_KS_STORE_PASS=${{ secrets.DQ_KS_STORE_PASS }}" >> "$GITHUB_ENV"

      - name: Build release APK
        run: ./gradlew assembleRelease --stacktrace --no-daemon

      - name: Rename APK
        run: |
          mkdir -p dist
          cp app/build/outputs/apk/release/app-release.apk dist/DroneQuiz-${{ env.APP_VERSION_NAME }}.apk

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: DroneQuiz-${{ env.APP_VERSION_NAME }}
          path: dist/DroneQuiz-${{ env.APP_VERSION_NAME }}.apk

      - name: Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ env.APP_VERSION_TAG }}
          name: DroneQuiz ${{ env.APP_VERSION_TAG }}
          files: dist/DroneQuiz-${{ env.APP_VERSION_NAME }}.apk
          body: |
            无人机装调题库刷题 APP v2.6.4 —— 回归蒙版柔化（雾条废弃）+ 过冲越界修复

            【柔化方案回调 + 修正】（重点）
            - 雾条方案废弃：壁纸模式下雾色与背景色差大（出现色带+硬边）、且会盖住
              玻璃卡上缘——实测不可接受，完整移除；
            - 恢复"内容渐隐蒙版"柔化（你确认"那个是正确的"），并修掉它的两个老毛病：
              ① 闪：柔化强度依旧绘制阶段直读（Modifier 稳定零重建，v2.6.2 修正保留）；
              ② 首卡上阴影被截断的伪影：此前离屏层是无条件开启的——即使停在顶部
                （不需要柔化），玻璃卡上溢的高光/阴影也被离屏边界裁掉；
                现在离屏改为动态开启：仅滚离顶部需要蒙版时才离屏，
                停在顶部时普通合成，卡片上阴影完整显示

            【过冲越界修复】
            - 修复上拉/下拉过冲回弹时列表内容越出容器、盖住固定标题/底栏的问题：
              回弹容器增加固定边界裁剪，过冲位移的内容在容器边缘被裁掉，
              顶部露背景（标准 iOS rubber-band 观感）

            固定签名，可直接覆盖安装 v2.x
          overwrite_files: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
