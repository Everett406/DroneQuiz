name: Build APK

on:
  push:
    branches: [ main ]
  workflow_dispatch:

permissions:
  contents: write

env:
  APP_VERSION_NAME: 2.6.1
  APP_VERSION_TAG: v2.6.1

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4

      # 固定签名：从 secrets 恢复 keystore，保证每个版本签名一致、可覆盖安装
      - name: Restore signing keystore
        run: |
          echo "${{ secrets.DQ_KEYSTORE_B64 }}" | base64 -d > "$RUNNER_TEMP/dronequiz.keystore"
          echo "DQ_KS_PATH=$RUNNER_TEMP/dronequiz.keystore" >> "$GITHUB_ENV"
          echo "DQ_KS_STORE_PASS=${{ secrets.DQ_KS_STORE_PASS }}" >> "$GITHUB_ENV"

      - name: Build release APK
        run: ./gradlew assembleRelease --stacktrace --no-daemon

      - name: Rename APK
        run: |
          mkdir -p dist
          cp app/build/outputs/apk/release/app-release.apk dist/DroneQuiz-${{ env.APP_VERSION_NAME }}.apk

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: DroneQuiz-${{ env.APP_VERSION_NAME }}
          path: dist/DroneQuiz-${{ env.APP_VERSION_NAME }}.apk

      - name: Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ env.APP_VERSION_TAG }}
          name: DroneQuiz ${{ env.APP_VERSION_TAG }}
          files: dist/DroneQuiz-${{ env.APP_VERSION_NAME }}.apk
          body: |
            无人机装调题库刷题 APP v2.6.1 —— 滚动惯性真根因修复 + 手感细节打磨

            【滚动惯性修复 v5】（重点，前几版未修透的真正原因）
            - 经 GitHub/官方文档调研定位：onPreFling 的返回值语义是"本层消费的速度"，
              此前两版把"要交还给列表的速度"当返回值返回——等于把甩动速度全部吞掉，
              列表收到 0 速度，松手即停、毫无惯性；
            - 本版把返回值语义全部修正：未过冲时消费 0（普通甩动零干扰、惯性完整保留），
              过冲时强甩向内容侧交还全部速度（列表立即带惯性滚动）；
              甩不回/往外甩才消费速度交给回弹动画；
            - 新增 fling 自然结束兜底：滚动途中撞边产生的橡皮筋拉伸，
              在滚动停止后带残余速度自然回弹（此前会挂住不回弹，直到下次触摸）

            【柔化动态化】（你圈出的问题：顶部图形被渐变遮挡）
            - 各页标题下缘、答题卡题号网格的柔化改为"滚离边缘才渐显"：
              停在顶部/底部时完全无柔化，内容不再被渐变裁切；
              开始滚动后柔化淡入，停在中间时保持

            【界面与体验】
            - 底栏"刷题"图标重绘：去掉怪异的后卡帽，改为与错题本成对的"方块+对勾"
            - 主页连击卡与今日卡等高对齐（强迫症友好）
            - 每日提醒智能化：不再固定 20 点，自动学习你常开始刷题的时间
              （最近 10 天首次刷题时刻的中位数，无数据默认晚间）；
              当天已刷过就不打扰；去掉"首次开启需通知权限"等说教文案
            - 自定义壁纸下文字可读性：亮色叠米白纱、深色叠墨色纱，
              任意壁纸、任意主题下文字都清晰

            固定签名，可直接覆盖安装 v2.x
          overwrite_files: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
