name: Build APK

on:
  push:
    branches: [ main ]
  workflow_dispatch:

permissions:
  contents: write

env:
  APP_VERSION_NAME: 2.5.0
  APP_VERSION_TAG: v2.5.0

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4

      # 固定签名：从 secrets 恢复 keystore，保证每个版本签名一致、可覆盖安装
      - name: Restore signing keystore
        run: |
          echo "${{ secrets.DQ_KEYSTORE_B64 }}" | base64 -d > "$RUNNER_TEMP/dronequiz.keystore"
          echo "DQ_KS_PATH=$RUNNER_TEMP/dronequiz.keystore" >> "$GITHUB_ENV"
          echo "DQ_KS_STORE_PASS=${{ secrets.DQ_KS_STORE_PASS }}" >> "$GITHUB_ENV"

      - name: Build release APK
        run: ./gradlew assembleRelease --stacktrace --no-daemon

      - name: Rename APK
        run: |
          mkdir -p dist
          cp app/build/outputs/apk/release/app-release.apk dist/DroneQuiz-${{ env.APP_VERSION_NAME }}.apk

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: DroneQuiz-${{ env.APP_VERSION_NAME }}
          path: dist/DroneQuiz-${{ env.APP_VERSION_NAME }}.apk

      - name: Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ env.APP_VERSION_TAG }}
          name: DroneQuiz ${{ env.APP_VERSION_TAG }}
          files: dist/DroneQuiz-${{ env.APP_VERSION_NAME }}.apk
          body: |
            无人机装调题库刷题 APP v2.5.0 —— 弹窗玻璃修正 + 全局手感升级

            【弹窗玻璃修正】（重点）
            - 修复答题卡/弹窗展开时面板自身也被模糊的问题：
              弹窗面板改为在模糊层之外渲染，永远清晰锐利
            - 面板现在能真实折射"模糊后的内容"，更接近 iOS 液态玻璃质感；
              同屏多个弹窗互不遮挡

            【全局滚动与切题手感】
            - 重写全局上下过冲回弹：iOS 同款 rubber-band 曲线 + 临界阻尼弹簧，
              修复拖拽中顿挫/抖动，手感软糯丝滑；设置页也补齐同款回弹
            - 刷题左右切题新增"转盘"弧度效果：页面随滑动绕竖轴轻微偏转、
              邻页向圆心轻收，带半径纵深感

            【界面整理】
            - 模考配置页紧凑化：题目数量/时长/判断占比/及格分压缩为 2×2 设置格，
              首屏即可见"开始考试"与最近模考，不再被设置项挤满
            - 移除刷题页"继续上次"卡片（与错题本练习重复、易混淆）
            - 错题本：去掉右上角重复的纯图标特训入口（保留图案+字按钮）；
              类目标签不再标红，改为中性色低调显示
            - 首页错题本/上次模考卡片：间距与圆角统一，不再贴叠

            固定签名，可直接覆盖安装 v2.x
          overwrite_files: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
