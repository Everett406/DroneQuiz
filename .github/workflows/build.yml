name: Build APK

on:
  push:
    branches: [ main ]
    # 纯文档提交不触发构建：避免同版本号 tag 重复发布
    paths-ignore:
      - '**.md'
  workflow_dispatch:

permissions:
  contents: write

env:
  APP_VERSION_NAME: 2.8.4
  APP_VERSION_TAG: v2.8.4

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4

      # 固定签名：从 secrets 恢复 keystore，保证每个版本签名一致、可覆盖安装
      - name: Restore signing keystore
        run: |
          echo "${{ secrets.DQ_KEYSTORE_B64 }}" | base64 -d > "$RUNNER_TEMP/dronequiz.keystore"
          echo "DQ_KS_PATH=$RUNNER_TEMP/dronequiz.keystore" >> "$GITHUB_ENV"
          echo "DQ_KS_STORE_PASS=${{ secrets.DQ_KS_STORE_PASS }}" >> "$GITHUB_ENV"

      - name: Build release APK
        run: ./gradlew assembleRelease --stacktrace --no-daemon

      - name: Rename APK
        run: |
          mkdir -p dist
          cp app/build/outputs/apk/release/app-release.apk dist/DroneQuiz-${{ env.APP_VERSION_NAME }}.apk

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: DroneQuiz-${{ env.APP_VERSION_NAME }}
          path: dist/DroneQuiz-${{ env.APP_VERSION_NAME }}.apk

      - name: Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ env.APP_VERSION_TAG }}
          name: DroneQuiz ${{ env.APP_VERSION_TAG }}
          files: dist/DroneQuiz-${{ env.APP_VERSION_NAME }}.apk
          body: |
            题屿 v2.8.4 —— 第十九轮体验修复：组卷题型修复 + 题型多选 + 填空题视觉重做
            
            【模考 · 组卷重大修复】
            - 修复「自带 20 题的题库无论怎么调，最终只有 4 题可做」：此前题型排序记录是
              全局的，切到新题库后被当成「白名单」，把多选/填空/简答整体过滤掉——
              现在题库里有哪种题型就参与组卷，一种都不丢；
            - 修复「题型构成关闭自动后只剩判断和单选、顺序奇怪」：同一根因，已一并解决；
            - 修复拖动一处比例滑杆时，受联动的其他滑杆只变数字、位置不动：
              现在所有滑杆位置实时平滑跟随；
            - 修复点击「自动配比」等开关后面板自动收起：高级选项改为仅点标题行展开/收起，
              卡内开关、滑杆、拖拽排序不再影响面板开合；
            - 模考配置页第 4 张小卡补齐（题型构成摘要 + 各题型占比预览条，点击直达高级选项），
              2×2 网格恢复对称。
            
            【刷题 · 题型多选】
            - 「全部题型」筛选保留「全部」，其余题型改为多选：想刷「单选+判断」「多选+填空」
              随意组合，不再只能二选一；全部勾选时自动归位到「全部」。
            
            【刷题 · 填空题视觉重做】
            - 输入空位大幅变小：宽度随内容自适应（空态最小、随输入增长），不再一整条大空框；
            - 修复题目重复显示两份：填空题题干只展示内嵌输入的一份；
            - 「填完所有空后提交」按钮自适应壁纸：自定义壁纸偏暗/偏亮时按钮底色与文字
              自动反色，任何壁纸上都清晰可读。
            
            固定签名，可直接覆盖安装 v2.x
