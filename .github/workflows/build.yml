name: Build APK

on:
  push:
    branches: [ main ]
  workflow_dispatch:

permissions:
  contents: write

env:
  APP_VERSION_NAME: 2.3.1
  APP_VERSION_TAG: v2.3.1

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4

      # 固定签名：从 secrets 恢复 keystore，保证每个版本签名一致、可覆盖安装
      - name: Restore signing keystore
        run: |
          echo "${{ secrets.DQ_KEYSTORE_B64 }}" | base64 -d > "$RUNNER_TEMP/dronequiz.keystore"
          echo "DQ_KS_PATH=$RUNNER_TEMP/dronequiz.keystore" >> "$GITHUB_ENV"
          echo "DQ_KS_STORE_PASS=${{ secrets.DQ_KS_STORE_PASS }}" >> "$GITHUB_ENV"

      - name: Build release APK
        run: ./gradlew assembleRelease --stacktrace --no-daemon

      - name: Rename APK
        run: |
          mkdir -p dist
          cp app/build/outputs/apk/release/app-release.apk dist/DroneQuiz-${{ env.APP_VERSION_NAME }}.apk

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: DroneQuiz-${{ env.APP_VERSION_NAME }}
          path: dist/DroneQuiz-${{ env.APP_VERSION_NAME }}.apk

      - name: Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ env.APP_VERSION_TAG }}
          name: DroneQuiz ${{ env.APP_VERSION_TAG }}
          files: dist/DroneQuiz-${{ env.APP_VERSION_NAME }}.apk
          body: |
            无人机装调题库刷题 APP v2.3.1 —— 修复启动崩溃（热修复）
            
            【修复：启动即闪退（v2.3.0 回归，强烈建议升级）】
            - 现象：安装 v2.3.0 后启动即异常退出，报告 UnsupportedOperationException:
              "Only RoundedRectangularShape or CornerBasedShape is supported in lens effects."
            - 根因：vendor 的 lens 折射效果丢失了 Kyant Shapes（RoundedRectangularShape）分支，
              而底栏/按钮/滑杆/开关全部使用官方 Capsule 胶囊形状 → 首帧即抛异常
            - 修复：补回 RoundedRectangularShape 角半径计算（与上游 AndroidLiquidGlass 一致），
              Capsule 连续曲率胶囊的折射效果恢复正常
            - 加固：lens 遇到真正不支持的形状时改为优雅降级（仅保留模糊、不折射），
              任何情况下不再因此崩溃；AGSL 着色器编译失败时同样保底不闪退
            
            v2.3.0 完整更新（液态玻璃全面重构 + 数据层修复）见上一版本说明或 CHANGELOG.md
            
            固定签名，可直接覆盖安装 v2.x
          overwrite_files: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
