name: Build APK

on:
  push:
    branches: [ main ]
  workflow_dispatch:

permissions:
  contents: write

env:
  APP_VERSION_NAME: 2.6.0
  APP_VERSION_TAG: v2.6.0

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4

      # 固定签名：从 secrets 恢复 keystore，保证每个版本签名一致、可覆盖安装
      - name: Restore signing keystore
        run: |
          echo "${{ secrets.DQ_KEYSTORE_B64 }}" | base64 -d > "$RUNNER_TEMP/dronequiz.keystore"
          echo "DQ_KS_PATH=$RUNNER_TEMP/dronequiz.keystore" >> "$GITHUB_ENV"
          echo "DQ_KS_STORE_PASS=${{ secrets.DQ_KS_STORE_PASS }}" >> "$GITHUB_ENV"

      - name: Build release APK
        run: ./gradlew assembleRelease --stacktrace --no-daemon

      - name: Rename APK
        run: |
          mkdir -p dist
          cp app/build/outputs/apk/release/app-release.apk dist/DroneQuiz-${{ env.APP_VERSION_NAME }}.apk

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: DroneQuiz-${{ env.APP_VERSION_NAME }}
          path: dist/DroneQuiz-${{ env.APP_VERSION_NAME }}.apk

      - name: Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ env.APP_VERSION_TAG }}
          name: DroneQuiz ${{ env.APP_VERSION_TAG }}
          files: dist/DroneQuiz-${{ env.APP_VERSION_NAME }}.apk
          body: |
            无人机装调题库刷题 APP v2.6.0 —— 惯性修复 + 刷题接续 + 全新功能

            【滚动惯性修复】（重点）
            - 修复"停止滑动列表就停、没有惯性"：过冲状态存在异步时序竞态导致残留，
              每次松手都被误判为过冲处理并同步阻塞数百毫秒，fling 被推迟；
            - 现在过冲量同步直写（零竞态）、松手处理零挂起——普通滑动惯性完全不受影响，
              过冲状态向内容侧甩动时速度立刻交还列表（惯性立即生效）

            【刷题自动接续】（重点）
            - 修复"刷过的题没记录"：再次开始刷题时自动恢复上次会话——
              直接定位到上次进度、已刷题目保留正确/错误标记（换筛选条件则开新会话）

            【新功能】
            - 题目搜索：刷题页顶部新增入口，支持题干/选项/解析全文检索，
              结果可展开查看全部选项、正确答案与解析
            - 全局壁纸：设置-外观可导入图片作全局背景纹路，可选模糊化、可恢复默认
            - 底栏玻璃模糊度三档可调（低/中/高）
            - 错题本：顶部筛选（全部/单选/判断/分类）+ 右侧快速滚动把手

            【体验细化】
            - 答题卡/题目面板：去掉深色遮罩（真模糊已足够层次）；
              顶部新增小把手，可拖动下滑关闭（松手超阈值关闭、否则弹性回位）；
              题号网格上下边缘柔化渐隐，不再硬切行
            - 四个 Tab 页标题固定在顶部不随滚动（错题本同款），标题下缘内容柔化渐隐
            - Tab 等图标全部换为填充式（更醒目）
            - 深色模式开关：开启态钮身转深，不再白底白钮难以辨认
            - 每日打卡卡片活力化：动态激励文案 + 里程碑进度（3/7/14/21/30/50/100 天）
            - 预估通过率现在参考设置中的及格分（改及格分立即重新计算）

            固定签名，可直接覆盖安装 v2.x
          overwrite_files: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
