name: Build APK

on:
  push:
    branches: [ main ]
    # 纯文档提交不触发构建：避免同版本号 tag 重复发布
    paths-ignore:
      - '**.md'
  workflow_dispatch:

permissions:
  contents: write

env:
  APP_VERSION_NAME: 2.8.6
  APP_VERSION_TAG: v2.8.6

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4

      # 固定签名：从 secrets 恢复 keystore，保证每个版本签名一致、可覆盖安装
      - name: Restore signing keystore
        run: |
          echo "${{ secrets.DQ_KEYSTORE_B64 }}" | base64 -d > "$RUNNER_TEMP/dronequiz.keystore"
          echo "DQ_KS_PATH=$RUNNER_TEMP/dronequiz.keystore" >> "$GITHUB_ENV"
          echo "DQ_KS_STORE_PASS=${{ secrets.DQ_KS_STORE_PASS }}" >> "$GITHUB_ENV"

      - name: Build release APK
        run: ./gradlew assembleRelease --stacktrace --no-daemon

      - name: Rename APK
        run: |
          mkdir -p dist
          cp app/build/outputs/apk/release/app-release.apk dist/DroneQuiz-${{ env.APP_VERSION_NAME }}.apk

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: DroneQuiz-${{ env.APP_VERSION_NAME }}
          path: dist/DroneQuiz-${{ env.APP_VERSION_NAME }}.apk

      - name: Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ env.APP_VERSION_TAG }}
          name: DroneQuiz ${{ env.APP_VERSION_TAG }}
          files: dist/DroneQuiz-${{ env.APP_VERSION_NAME }}.apk
          body: |
            题屿 v2.8.6 —— 护眼提醒 + 顺序刷题循环补漏 + 一波体验修正
            
            【护眼提醒 · 防沉迷】
            - 设置 → 提醒，新增「护眼提醒」开关（默认关）；
            - 开启后，连续刷题满 20 分钟会弹窗提醒你看看远处休息一下（20-20-20 护眼法则）；
            - 只在应用前台计时，切后台自动暂停；模考/考试完全不受影响。
            
            【刷题 · 循环补漏】
            - 顺序刷题刷到最后一题即视为本轮结束：下次进入会自动开一轮，
              只挑你还没刷过的题（比如上次直接跳到第 200 题往后刷，下轮自动从第 1 题补上）；
            - 补漏轮也刷完后，再进入就开完整新一轮，周而复始。
            
            【模考 · 成绩单】
            - 成绩单现在会显示你开考时设定的合格线（如"答对 12 / 20 题 · 合格线 60 分"）。
            
            【导入 · 更清爽】
            - 「导入 CSV / 导入 ZIP」卡片内与下方的灰色说明小字已移除；
            - 底部按钮简化命名：「分享 CSV 模板」→「CSV 模板」，「复制 Agent 提示词」→「提示词」。
            
            【图片 · 小图更小】
            - 题目图片小图整体缩小（宽度贴合图片、限高 64–96dp），不再占满整行；
            - 移除了"点按放大"角标，点按大图/收起的交互保持不变。
            
            【其他】
            - 打赏页收款码图片与外层圆角卡片同心裁切，不再露出直角截图边缘；
            - 性能优化：大幅减少刷题翻页/作答时的无效全局重组，导入大题库（如驾考 1000+ 题）
              后的滑动卡顿应明显缓解；单轮题单上限从 800 提升到 2000 题。
            
            固定签名，可直接覆盖安装 v2.x
