name: Build APK

on:
  push:
    branches: [ main ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Build release APK
        run: ./gradlew assembleRelease --stacktrace --no-daemon

      - name: Rename APK
        run: |
          mkdir -p dist
          cp app/build/outputs/apk/release/app-release.apk dist/DroneQuiz-v2.0.apk

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: DroneQuiz-v2.0
          path: dist/DroneQuiz-v2.0.apk

      - name: Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v2.0
          name: DroneQuiz v2.0
          files: dist/DroneQuiz-v2.0.apk
          body: |
            无人机装调题库刷题 APP v2.0
            - 真·液态玻璃（Kyant0 backdrop，AGSL 折射/色散/高光）
            - 浮动玻璃胶囊底栏（自绘矢量图标）
            - iOS 式过冲回弹、统一转场（无重叠）、按钮按压动画
            - 首页可视化重做、刷题页标题置顶、题号面板、可拖动滑杆
            - 修复模考交卷崩溃（wrongbook.addedAt）
          overwrite_files: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
