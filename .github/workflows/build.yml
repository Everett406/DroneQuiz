name: Build APK

on:
  push:
    branches: [ main ]
  workflow_dispatch:

permissions:
  contents: write

env:
  APP_VERSION_NAME: 2.7.0
  APP_VERSION_TAG: v2.7.0

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4

      # 固定签名：从 secrets 恢复 keystore，保证每个版本签名一致、可覆盖安装
      - name: Restore signing keystore
        run: |
          echo "${{ secrets.DQ_KEYSTORE_B64 }}" | base64 -d > "$RUNNER_TEMP/dronequiz.keystore"
          echo "DQ_KS_PATH=$RUNNER_TEMP/dronequiz.keystore" >> "$GITHUB_ENV"
          echo "DQ_KS_STORE_PASS=${{ secrets.DQ_KS_STORE_PASS }}" >> "$GITHUB_ENV"

      - name: Build release APK
        run: ./gradlew assembleRelease --stacktrace --no-daemon

      - name: Rename APK
        run: |
          mkdir -p dist
          cp app/build/outputs/apk/release/app-release.apk dist/DroneQuiz-${{ env.APP_VERSION_NAME }}.apk

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: DroneQuiz-${{ env.APP_VERSION_NAME }}
          path: dist/DroneQuiz-${{ env.APP_VERSION_NAME }}.apk

      - name: Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ env.APP_VERSION_TAG }}
          name: DroneQuiz ${{ env.APP_VERSION_TAG }}
          files: dist/DroneQuiz-${{ env.APP_VERSION_NAME }}.apk
          body: |
            无人机装调题库刷题 APP v2.7.0 —— 羽化方案重做 + 首页焕新 + 搜索体验升级

            【顶部羽化 v3：saveLayer 重做】（重点，按你的视频定位后从底层重写）
            - 你的录屏暴露了灾难级问题：滚动中多帧"整页内容变淡"——
              上一版动态离屏在阈值穿越时重建图形层，重建帧整层未就绪；
            - 彻底重做：不再持有任何跨帧图形层，改为每次绘制内用
              saveLayer/restore 临时离屏——层每帧独立创建销毁，物理上无重建、无闪烁；
            - 离屏边界四周扩大 24dp：滚入羽化区的玻璃卡上溢高光/阴影被完整保留；
            - 停在顶部时完全直绘（零开销），羽化随滚动距离连续渐显、跟手

            【首页焕新】
            - 大标题改为按时间问候：早上好/中午好/下午好/晚上好 + 你的昵称
              （默认"机长"，设置-外观顶部可改，最多 12 字）
            - "今日"卡片重排：题量与正确率 + 答对/答错双色占比条，不再空洞

            【搜索体验】
            - 搜索历史：自动记录最近 8 条（去重置顶），空查询时展示历史胶囊，
              点按即搜、可一键清空
            - Hero 动画：刷题页搜索框与搜索页输入框共享元素转场，点击后两框平滑飞行衔接

            【界面细节】
            - 错题本筛选胶囊微交互：按压缩放回弹 + 选中态颜色渐变过渡（不再"秒变黑"）
            - 错题本滚动把手重做：触控轨道加宽至 44dp 好抓、拖动改绝对映射
              （消除旧版自反馈漂移抖动）、拖动时拇指放大高亮、点按轨道直接跳转
            - 设置页分区重排：刷题提到全局壁纸之前（刷题为主）

            固定签名，可直接覆盖安装 v2.x
          overwrite_files: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
