name: Build APK

on:
  push:
    branches: [ main ]
    # 纯文档提交不触发构建：避免同版本号 tag 重复发布
    paths-ignore:
      - '**.md'
  workflow_dispatch:

permissions:
  contents: write

env:
  APP_VERSION_NAME: 2.10.0
  APP_VERSION_TAG: v2.10.0

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4

      # 固定签名：从 secrets 恢复 keystore，保证每个版本签名一致、可覆盖安装
      - name: Restore signing keystore
        run: |
          echo "${{ secrets.DQ_KEYSTORE_B64 }}" | base64 -d > "$RUNNER_TEMP/dronequiz.keystore"
          echo "DQ_KS_PATH=$RUNNER_TEMP/dronequiz.keystore" >> "$GITHUB_ENV"
          echo "DQ_KS_STORE_PASS=${{ secrets.DQ_KS_STORE_PASS }}" >> "$GITHUB_ENV"

      - name: Build release APK
        run: ./gradlew assembleRelease --stacktrace --no-daemon

      - name: Rename APK
        run: |
          mkdir -p dist
          cp app/build/outputs/apk/release/app-release.apk dist/TiYu-${{ env.APP_VERSION_NAME }}.apk

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: TiYu-${{ env.APP_VERSION_NAME }}
          path: dist/TiYu-${{ env.APP_VERSION_NAME }}.apk

      - name: Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ env.APP_VERSION_TAG }}
          name: 题屿 TiYu ${{ env.APP_VERSION_TAG }}
          files: dist/TiYu-${{ env.APP_VERSION_NAME }}.apk
          body: |
            题屿 v2.10.0 —— 桌面小组件 · 快捷方式 · 成绩分享卡

            【新增 · 桌面小组件】（极简杂志风，深浅色自适应）
            - 继续刷题磁贴：今日题量大数字 + 连续打卡，点按直落上次进度；
            - 学习统计卡：每日目标进度环 + 正确率 + 连击 +「距目标还差 N 题」；
            - 错题特训卡：待攻克错题数一目了然，点按直落特训；
            - 快速模考贴：上次模考成绩与合格态，点按沿用上次配置直接开考；
            - 作答/交卷/删除记录即时刷新，30 分钟兜底校准；设置-刷题新增「每日目标」。

            【新增 · 长按图标快捷方式】
            - 继续刷题（接续上次会话）/ 错题特训（沿用上次筛选）/
              随机小练（随机抽 20 题立即开练）/ 快速模考（沿用上次配置，跳过配置页）。

            【新增 · 成绩分享卡】
            - 模考成绩页「生成成绩卡」：与成绩页完全不同的重新设计；
            - 7 套主题：日落 / 极光 / 薄荷渐变 + 液态玻璃 + 纸感白 + 墨黑 + 深色金辉；
            - 内容：大分数、合格徽章、正确率/用时/答对/连击四宫格、
              「较上次 ↑N 分」进步对比、累计刷题与打卡；
            - 个性化全套自定义：署名、标语、强调色微调，即改即存下次记住；
            - 保存到相册（免权限）或拉起系统分享面板，预览即最终产物。

            固定签名，可直接覆盖安装 v2.x
