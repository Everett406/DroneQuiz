name: Build APK

on:
  push:
    branches: [ main ]
  workflow_dispatch:

permissions:
  contents: write

env:
  APP_VERSION_NAME: 2.7.1
  APP_VERSION_TAG: v2.7.1

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4

      # 固定签名：从 secrets 恢复 keystore，保证每个版本签名一致、可覆盖安装
      - name: Restore signing keystore
        run: |
          echo "${{ secrets.DQ_KEYSTORE_B64 }}" | base64 -d > "$RUNNER_TEMP/dronequiz.keystore"
          echo "DQ_KS_PATH=$RUNNER_TEMP/dronequiz.keystore" >> "$GITHUB_ENV"
          echo "DQ_KS_STORE_PASS=${{ secrets.DQ_KS_STORE_PASS }}" >> "$GITHUB_ENV"

      - name: Build release APK
        run: ./gradlew assembleRelease --stacktrace --no-daemon

      - name: Rename APK
        run: |
          mkdir -p dist
          cp app/build/outputs/apk/release/app-release.apk dist/DroneQuiz-${{ env.APP_VERSION_NAME }}.apk

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: DroneQuiz-${{ env.APP_VERSION_NAME }}
          path: dist/DroneQuiz-${{ env.APP_VERSION_NAME }}.apk

      - name: Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ env.APP_VERSION_TAG }}
          name: DroneQuiz ${{ env.APP_VERSION_TAG }}
          files: dist/DroneQuiz-${{ env.APP_VERSION_NAME }}.apk
          body: |
            无人机装调题库刷题 APP v2.7.1 —— 羽化过渡打磨 + 交互细节修复

            【顶部羽化 v4:过渡打磨】(重点,按你新一期视频逐帧定位)
            - 你的反馈"不闪了,但过渡还要打磨"已定位到根源:
              旧模型把渐变强度当整条曲线的透明度系数——滚动一点点,
              首卡整个顶部区域就一起微微变淡,内容"还没到边缘就提前变淡";
            - 重做为"生长式蒙版":蒙版高度=已滚出像素(封顶 36dp),
              内容滚到哪里、淡到哪里,未达边缘的内容永不提前变淡;
            - 淡出曲线改 smoothstep(两端平缓中段顺滑),替代线性渐变的"被切"感;
            - 稳态羽化带加高到 36dp,淡出更绵长自然;答题卡网格同步同款模型

            【修复】
            - 搜索框 Hero 动画修复:此前共享元素作用域从未注入,
              动画实际从未生效;现已真正接通,刷题页搜索框平滑飞行到搜索页
            - 输入光标:搜索框与昵称框光标从亮橙改为正文墨色,不再扎眼

            【昵称与问候】
            - 默认不再称呼"机长":未设置昵称时只按时间问候(早上好/晚上好…)
            - 昵称可自定义,最长 5 个字;说明文字去掉字数备注
            - 保存方式改为显式"确认"按钮(替代此前的停止输入自动保存)

            【首页双卡排版统一】
            - 连击卡与今日卡改为完全同构的五行走线:
              图标+标签 / 大数字 / 副行 / 进度条 / 底注,
              字号、间距、条高逐行对齐,仅图标与条色按语义区分

            固定签名,可直接覆盖安装 v2.x
