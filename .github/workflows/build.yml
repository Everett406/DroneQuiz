name: Build APK

on:
  push:
    branches: [ main ]
  workflow_dispatch:

permissions:
  contents: write

env:
  APP_VERSION_NAME: 2.6.3
  APP_VERSION_TAG: v2.6.3

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4

      # 固定签名：从 secrets 恢复 keystore，保证每个版本签名一致、可覆盖安装
      - name: Restore signing keystore
        run: |
          echo "${{ secrets.DQ_KEYSTORE_B64 }}" | base64 -d > "$RUNNER_TEMP/dronequiz.keystore"
          echo "DQ_KS_PATH=$RUNNER_TEMP/dronequiz.keystore" >> "$GITHUB_ENV"
          echo "DQ_KS_STORE_PASS=${{ secrets.DQ_KS_STORE_PASS }}" >> "$GITHUB_ENV"

      - name: Build release APK
        run: ./gradlew assembleRelease --stacktrace --no-daemon

      - name: Rename APK
        run: |
          mkdir -p dist
          cp app/build/outputs/apk/release/app-release.apk dist/DroneQuiz-${{ env.APP_VERSION_NAME }}.apk

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: DroneQuiz-${{ env.APP_VERSION_NAME }}
          path: dist/DroneQuiz-${{ env.APP_VERSION_NAME }}.apk

      - name: Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ env.APP_VERSION_TAG }}
          name: DroneQuiz ${{ env.APP_VERSION_TAG }}
          files: dist/DroneQuiz-${{ env.APP_VERSION_NAME }}.apk
          body: |
            无人机装调题库刷题 APP v2.6.3 —— 伪影根除方案重构 + 内置壁纸 + 壁纸修复

            【标题柔化 V2：雾条方案，根除伪影】（重点）
            - 你反馈"伪影依然存在，只是减轻了一点点"——确认离屏蒙版与液态玻璃卡
              的折射层存在方案级互作（v2.6.2 的 Modifier 稳定化只减轻了重建因素）；
            - 本版彻底换方案：标题下方改叠一条"背景色雾"——纯渐变色块随滚动渐显，
              零离屏、零蒙版，与玻璃卡完全无互作，物理上不可能再有重影/色块；
            - 内容滚入标题下方被雾遮没，效果不变；停在顶部时无雾、首屏不被遮挡
            - 答题卡题号网格（无玻璃卡）保留原柔化

            【内置壁纸】
            - 设置-全局壁纸新增四个内置纹路：山野清晨 / 林海深处 / 云上航线 / 黄昏原野，
              点缩略图即设为全局背景，支持模糊与文字纱，选中项描边标记

            【修复：更换壁纸不生效】
            - 此前每次导入都写同一个文件名，背景层不重新加载，永远显示第一次的图；
            - 现在导入/内置均用唯一文件名（路径必变→立即重新解码），并自动清理旧文件

            固定签名，可直接覆盖安装 v2.x
          overwrite_files: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
