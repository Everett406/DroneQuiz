name: Build APK

on:
  push:
    branches: [ main ]
  workflow_dispatch:

permissions:
  contents: write

env:
  APP_VERSION_NAME: 2.3.2
  APP_VERSION_TAG: v2.3.2

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4

      # 固定签名：从 secrets 恢复 keystore，保证每个版本签名一致、可覆盖安装
      - name: Restore signing keystore
        run: |
          echo "${{ secrets.DQ_KEYSTORE_B64 }}" | base64 -d > "$RUNNER_TEMP/dronequiz.keystore"
          echo "DQ_KS_PATH=$RUNNER_TEMP/dronequiz.keystore" >> "$GITHUB_ENV"
          echo "DQ_KS_STORE_PASS=${{ secrets.DQ_KS_STORE_PASS }}" >> "$GITHUB_ENV"

      - name: Build release APK
        run: ./gradlew assembleRelease --stacktrace --no-daemon

      - name: Rename APK
        run: |
          mkdir -p dist
          cp app/build/outputs/apk/release/app-release.apk dist/DroneQuiz-${{ env.APP_VERSION_NAME }}.apk

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: DroneQuiz-${{ env.APP_VERSION_NAME }}
          path: dist/DroneQuiz-${{ env.APP_VERSION_NAME }}.apk

      - name: Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ env.APP_VERSION_TAG }}
          name: DroneQuiz ${{ env.APP_VERSION_TAG }}
          files: dist/DroneQuiz-${{ env.APP_VERSION_NAME }}.apk
          body: |
            无人机装调题库刷题 APP v2.3.2 —— 交互与功能批量修复
            
            【底栏】
            - 新增单击切换：点任意 tab 图标直接跳页（此前只能拖拽高亮块）
            - 修复拖拽切换概率失效：页面切换回调提前到动画前，
              连续拖拽/动画被打断时不再丢失切换
            
            【刷题】
            - 修复"一直加载题库"：加载增加超时兑底，失败给出重试按钮；
              题库后台导入完成后自动刷新；启动加载最多等 8 秒即放行主界面
            
            【滑杆】
            - 全部滑杆支持按住拖动（此前部分只能点按：拖拽手势会被页面滚动/进度回写抢走）
            - 触控区由 24dp 加高到 40dp，更好按；拖动中不再与外部值互相拉扯
            
            【模考】
            - 题目卡改为顶部对齐（此前垂直居中悬在屏幕中间）
            - 底部进度滑杆避开手势指示条（防止与系统手势误触），与左右按钮拉开间距
            - 新增玻璃答题卡面板：顶栏网格按钮打开，点题号直接跳题，已答/未答一目了然
            
            【通知】
            - 每日打卡通知开启时请求通知权限（Android 13+ 此前无法弹出）；
              拒绝授权时明确提示
            
            【说明】若从 v2.3.0 升级后看到的是"实色非玻璃"界面：那是启动守护的安全模式
            在生效（v2.3.0 崩溃触发过自动降级）。v2.3.1 已修复崩溃，正常启动一次后
            液态玻璃自动恢复；也可在 设置-画面特效 手动开启。
            
            固定签名，可直接覆盖安装 v2.x
          overwrite_files: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
