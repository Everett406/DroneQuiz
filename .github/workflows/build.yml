name: Build APK

on:
  push:
    branches: [ main ]
    # 纯文档提交不触发构建：避免同版本号 tag 重复发布
    paths-ignore:
      - '**.md'
  workflow_dispatch:

permissions:
  contents: write

env:
  APP_VERSION_NAME: 2.8.2
  APP_VERSION_TAG: v2.8.2

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4

      # 固定签名：从 secrets 恢复 keystore，保证每个版本签名一致、可覆盖安装
      - name: Restore signing keystore
        run: |
          echo "${{ secrets.DQ_KEYSTORE_B64 }}" | base64 -d > "$RUNNER_TEMP/dronequiz.keystore"
          echo "DQ_KS_PATH=$RUNNER_TEMP/dronequiz.keystore" >> "$GITHUB_ENV"
          echo "DQ_KS_STORE_PASS=${{ secrets.DQ_KS_STORE_PASS }}" >> "$GITHUB_ENV"

      - name: Build release APK
        run: ./gradlew assembleRelease --stacktrace --no-daemon

      - name: Rename APK
        run: |
          mkdir -p dist
          cp app/build/outputs/apk/release/app-release.apk dist/DroneQuiz-${{ env.APP_VERSION_NAME }}.apk

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: DroneQuiz-${{ env.APP_VERSION_NAME }}
          path: dist/DroneQuiz-${{ env.APP_VERSION_NAME }}.apk

      - name: Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ env.APP_VERSION_TAG }}
          name: DroneQuiz ${{ env.APP_VERSION_TAG }}
          files: dist/DroneQuiz-${{ env.APP_VERSION_NAME }}.apk
          body: |
            题屿 v2.8.2 —— 示例题库修复 + 题库隔离加固 + 一批体验打磨
            
            【重要修复】
            - 示例题库（生活常识 20 题，演示多选/填空/简答新题型）此前因校验缺陷从未出现，
              本版已修复；升级后启动即自动补种（若被删除过则尊重删除）；
            - 题库隔离加固：修复「切换题库后刷题页仍显示旧题库分类/概览」的问题；
              学习概览、今日已刷现在跟随当前题库；模考配置读取不再有旧库闪帧；
            - 首页「今日」「近 7 天练习」改为按当前题库统计（卡片标注「本题库」），
              打卡连击保持全 APP 习惯数据不变。
            
            【体验打磨】
            - 弹窗把手去重：导入题库 / 请作者喝杯奶茶弹窗不再出现两个小把手；
            - 模考「高级选项」展开/收起加入平滑动画（高度 + 透明度）；
            - 首页题库切换小窗升级为液态玻璃（与其他弹窗同款质感）+ 弹出动画，
              文字与问候语左对齐；
            - 模考「题型构成」加减号改为每题型一根滑杆（0 到可用量），与全 APP 滑杆手感一致；
            - CSV 模板改为系统分享：可直接发给微信好友 / 文件传输助手 / 电脑，不再只存下载目录；
            - 导入题库弹窗键盘避让：命名输入框不再被键盘遮挡；
            - 弹窗打开时自定义壁纸也一并被模糊（此前只有界面内容被模糊，壁纸依然清晰）。
            
            固定签名，可直接覆盖安装 v2.x
