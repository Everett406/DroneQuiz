name: Build APK

on:
  push:
    branches: [ main ]
  workflow_dispatch:

permissions:
  contents: write

env:
  APP_VERSION_NAME: 2.7.3
  APP_VERSION_TAG: v2.7.3

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4

      # 固定签名：从 secrets 恢复 keystore，保证每个版本签名一致、可覆盖安装
      - name: Restore signing keystore
        run: |
          echo "${{ secrets.DQ_KEYSTORE_B64 }}" | base64 -d > "$RUNNER_TEMP/dronequiz.keystore"
          echo "DQ_KS_PATH=$RUNNER_TEMP/dronequiz.keystore" >> "$GITHUB_ENV"
          echo "DQ_KS_STORE_PASS=${{ secrets.DQ_KS_STORE_PASS }}" >> "$GITHUB_ENV"

      - name: Build release APK
        run: ./gradlew assembleRelease --stacktrace --no-daemon

      - name: Rename APK
        run: |
          mkdir -p dist
          cp app/build/outputs/apk/release/app-release.apk dist/DroneQuiz-${{ env.APP_VERSION_NAME }}.apk

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: DroneQuiz-${{ env.APP_VERSION_NAME }}
          path: dist/DroneQuiz-${{ env.APP_VERSION_NAME }}.apk

      - name: Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ env.APP_VERSION_TAG }}
          name: DroneQuiz ${{ env.APP_VERSION_TAG }}
          files: dist/DroneQuiz-${{ env.APP_VERSION_NAME }}.apk
          body: |
            题屿 v2.7.3 —— 随机刷题真随机 + 刷题进度接续加固 + 更名「题屿」+ 文案精简

            【随机刷题终于真随机】(双重根因同时拆除)
            - 根因一：洗牌后的题目 id 列表经 Room IN 查询，返回顺序固定按主键升序，
              洗牌被完全吃掉——随机列表实际就是题库顺序，这就是"随机和顺序一模一样"；
              现按洗牌后的顺序保序重排；
            - 根因二：刷题页读取"顺序/随机"设置用的是首帧默认值(顺序)，
              你选了随机也会被当成顺序加载；现改为挂起读真实设置

            【刷题进度接续三重加固】
            - 修复错题特训覆写刷题进度：此前进度快照只有一份，
              进一次错题特训就把刷题进度冲掉，再开刷只能从头开始；
            - 顺序/随机来回切换也能继续上次进度(有未完成会话就恢复列表+作答+位置)；
            - 整轮刷完自然开新一轮(随机重洗牌/顺序从头)

            【APP 更名「题屿」】
            - 桌面名称与设置-关于不再叫"无人机题库"；
              每日提醒通知文案同步中性化

            【错题本】
            - 筛选胶囊行与列表之间留出固定空隙，卡片滚到顶不再贴边擦蹭；
            - 滚动把手样式微调：稍宽稍清晰(5dp/40% 墨色)，拖动加粗提亮；
              像素级连续映射保持不变，流畅依旧

            【设置页文案精简】
            - 阅读字体描述改为四字短评，不再换行；
              示例文本改为"这是一段示例文本 Aa 0123"；
            - 每日提醒说明精简为一句，不再换行

            固定签名，可直接覆盖安装 v2.x
