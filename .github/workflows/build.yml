name: Build APK

on:
  push:
    branches: [ main ]
  workflow_dispatch:

permissions:
  contents: write

env:
  APP_VERSION_NAME: 2.6.2
  APP_VERSION_TAG: v2.6.2

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4

      # 固定签名：从 secrets 恢复 keystore，保证每个版本签名一致、可覆盖安装
      - name: Restore signing keystore
        run: |
          echo "${{ secrets.DQ_KEYSTORE_B64 }}" | base64 -d > "$RUNNER_TEMP/dronequiz.keystore"
          echo "DQ_KS_PATH=$RUNNER_TEMP/dronequiz.keystore" >> "$GITHUB_ENV"
          echo "DQ_KS_STORE_PASS=${{ secrets.DQ_KS_STORE_PASS }}" >> "$GITHUB_ENV"

      - name: Build release APK
        run: ./gradlew assembleRelease --stacktrace --no-daemon

      - name: Rename APK
        run: |
          mkdir -p dist
          cp app/build/outputs/apk/release/app-release.apk dist/DroneQuiz-${{ env.APP_VERSION_NAME }}.apk

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: DroneQuiz-${{ env.APP_VERSION_NAME }}
          path: dist/DroneQuiz-${{ env.APP_VERSION_NAME }}.apk

      - name: Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ env.APP_VERSION_TAG }}
          name: DroneQuiz ${{ env.APP_VERSION_TAG }}
          files: dist/DroneQuiz-${{ env.APP_VERSION_NAME }}.apk
          body: |
            无人机装调题库刷题 APP v2.6.2 —— 柔化渐显重写（去伪影/去闪烁）

            【柔化渐显重写】（重点，修复你圈出的伪影与"闪一下"）
            - 伪影与"柔化要么有要么没有、出现时所有内容闪一下"同根：
              此前柔化强度变化时每帧生成新的 Modifier，离屏蒙版层每帧销毁重建——
              重建瞬间旧层残影=伪影，重建黑帧=闪一下，渐变被闪烁淹没=突变感；
            - 现在柔化强度改为绘制阶段直读滚动像素（官方 defer state reads 最佳实践）：
              Modifier 全程稳定零重建，伪影与闪烁根除；
            - 强度同时改为跟随滚动距离连续变化：滑出多少渐显多少、跟手无延迟，
              真正的"渐渐出来"；停在顶部/底部时依旧完全无柔化

            覆盖：主页/刷题/模考/错题本/搜索五页标题柔化 + 模考/刷题答题卡题号网格柔化

            固定签名，可直接覆盖安装 v2.x
          overwrite_files: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
