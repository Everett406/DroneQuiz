name: Build APK

on:
  push:
    branches: [ main ]
    # 纯文档提交不触发构建：避免同版本号 tag 重复发布
    paths-ignore:
      - '**.md'
  workflow_dispatch:

permissions:
  contents: write

env:
  APP_VERSION_NAME: 2.8.5
  APP_VERSION_TAG: v2.8.5

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4

      # 固定签名：从 secrets 恢复 keystore，保证每个版本签名一致、可覆盖安装
      - name: Restore signing keystore
        run: |
          echo "${{ secrets.DQ_KEYSTORE_B64 }}" | base64 -d > "$RUNNER_TEMP/dronequiz.keystore"
          echo "DQ_KS_PATH=$RUNNER_TEMP/dronequiz.keystore" >> "$GITHUB_ENV"
          echo "DQ_KS_STORE_PASS=${{ secrets.DQ_KS_STORE_PASS }}" >> "$GITHUB_ENV"

      - name: Build release APK
        run: ./gradlew assembleRelease --stacktrace --no-daemon

      - name: Rename APK
        run: |
          mkdir -p dist
          cp app/build/outputs/apk/release/app-release.apk dist/DroneQuiz-${{ env.APP_VERSION_NAME }}.apk

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: DroneQuiz-${{ env.APP_VERSION_NAME }}
          path: dist/DroneQuiz-${{ env.APP_VERSION_NAME }}.apk

      - name: Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ env.APP_VERSION_TAG }}
          name: DroneQuiz ${{ env.APP_VERSION_TAG }}
          files: dist/DroneQuiz-${{ env.APP_VERSION_NAME }}.apk
          body: |
            题屿 v2.8.5 —— 图片题库来了：ZIP 导入（CSV + 图片）+ Agent 提示词 + 图片点按放大
            
            【导入 · ZIP 图片题库】
            - 导入方式改为「CSV 表格 / ZIP 压缩包」双通道，JSON 不再支持（旧 JSON 可让 Agent 转成 CSV）；
            - ZIP 里放一个题目 CSV + 一个 images 图片文件夹（图片也可在压缩包内任意层级），
              兼容只打包单个 CSV 的 ZIP；CSV 新增「图片」列填文件名，多图用 | 分隔，
              本地支持 jpg / jpeg / png / webp / gif / bmp；
            - 导入前逐行校验：图片引用在压缩包中找不到会明确报错；只有被题目引用的图片才会随题库保存；
            - 删除题库时自动清理它的图片文件，不留垃圾。
            
            【导入 · 复制 Agent 提示词】
            - 「查看示例」升级为「复制 Agent 提示词」：弹窗内可滚动预览完整提示词，一键复制；
            - 把 Excel / Word / PDF 题库材料连同提示词一起发给 AI Agent，
              它会按题屿的格式整理成 CSV（纯文字）或 ZIP（带图片），拿到文件直接导入即可；
            - CSV 模板同步更新：新增「图片」列 + 一行「带图题库怎么打包 ZIP」示例。
            
            【刷题 · 图片展示】
            - 带图题目默认显示小图，点按平滑放大为大图（Hero 式过渡），再点收起，
              刷题页与模考页都支持；图片加载失败会优雅降级提示。
            
            固定签名，可直接覆盖安装 v2.x
