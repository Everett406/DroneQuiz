name: Build APK

on:
  push:
    branches: [ main ]
    # 纯文档提交不触发构建：避免同版本号 tag 重复发布
    paths-ignore:
      - '**.md'
  workflow_dispatch:

permissions:
  contents: write

env:
  APP_VERSION_NAME: 2.8.0
  APP_VERSION_TAG: v2.8.0

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4

      # 固定签名：从 secrets 恢复 keystore，保证每个版本签名一致、可覆盖安装
      - name: Restore signing keystore
        run: |
          echo "${{ secrets.DQ_KEYSTORE_B64 }}" | base64 -d > "$RUNNER_TEMP/dronequiz.keystore"
          echo "DQ_KS_PATH=$RUNNER_TEMP/dronequiz.keystore" >> "$GITHUB_ENV"
          echo "DQ_KS_STORE_PASS=${{ secrets.DQ_KS_STORE_PASS }}" >> "$GITHUB_ENV"

      - name: Build release APK
        run: ./gradlew assembleRelease --stacktrace --no-daemon

      - name: Rename APK
        run: |
          mkdir -p dist
          cp app/build/outputs/apk/release/app-release.apk dist/DroneQuiz-${{ env.APP_VERSION_NAME }}.apk

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: DroneQuiz-${{ env.APP_VERSION_NAME }}
          path: dist/DroneQuiz-${{ env.APP_VERSION_NAME }}.apk

      - name: Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ env.APP_VERSION_TAG }}
          name: DroneQuiz ${{ env.APP_VERSION_TAG }}
          files: dist/DroneQuiz-${{ env.APP_VERSION_NAME }}.apk
          body: |
            题屿 v2.8.0 —— 多题库管理 + 多选/填空/简答新题型 + 模考题型自适应
            
            【多题库】
            - 设置 → 题库管理：所有题库统一管理，点名称即切换（当前使用高亮）；
            - 内置「无人机装调题库」与新增的「生活常识示例题库」都可删除；
              误删不用怕——「清空记录」会把内置题库恢复回来；
            - 首页副标题变成题库切换入口：点击「每日精进 · 当前题库名 ▾」
              弹出右键菜单式小窗，选库、管理一步到位；
            - 学习数据按题库隔离：切到哪个题库，进度/错题本/统计就是哪个题库的
              （打卡与每日提醒仍是全局习惯数据）
            
            【导入升级：JSON / CSV 底部弹窗】
            - 设置 → 导入题库改为底部弹窗，JSON、CSV 两种格式任选；
            - 内置 CSV 模板（可查看/一键复制/保存到「下载/题屿」）：
              把学习内容丢给 AI，让它按模板整理成表格，就能变成你的专属题库；
            - 导入前先出报告：识别成功多少题、失败行逐条给出原因；
            - 模板与《无人机装调题库》CSV 完全同构，解析列可留空
            
            【新题型】（先在示例题库里体验）
            - 多选题：点选多项后手动提交，全对才算对（考试同口径）；
            - 填空题：题干 ____ 占位，逐空输入，自动避让键盘，精确匹配判分；
            - 简答题：写下思路 → 对照参考答案自评「答对/答错」，计入正确率；
            - 刷题/模考的题型筛选、分类胶囊均按当前题库自适应（分类去掉重复的「全部」）
            
            【模考升级】
            - 修复随机抽卷时单选/判断混排的问题：按题型分段组卷、分段作答；
            - 高级选项（默认折叠）：题型顺序长按拖动自由排序；含简答题开关（默认关）；
            - 题库只有单选+判断时，保留原有的「题目数量+判断占比」滑杆；
            - 成绩页错题分布按题型展示，错题解析附「你的答案」对照
            
            【修复与细节】
            - 错题特训现在按当前筛选刷题（此前筛选判断题却出来全部错题）；
            - 设置 → 关于新增「请作者喝杯奶茶」入口，随时支持作者（不打扰自动弹窗）；
            - 正式数据库迁移 v1→v2：老版本升级数据完整保留
            
            固定签名，可直接覆盖安装 v2.x
