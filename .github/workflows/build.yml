name: Build APK

on:
  push:
    branches: [ main ]
    # 纯文档提交不触发构建：避免同版本号 tag 重复发布
    paths-ignore:
      - '**.md'
  workflow_dispatch:

permissions:
  contents: write

env:
  APP_VERSION_NAME: 2.8.3
  APP_VERSION_TAG: v2.8.3

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4

      # 固定签名：从 secrets 恢复 keystore，保证每个版本签名一致、可覆盖安装
      - name: Restore signing keystore
        run: |
          echo "${{ secrets.DQ_KEYSTORE_B64 }}" | base64 -d > "$RUNNER_TEMP/dronequiz.keystore"
          echo "DQ_KS_PATH=$RUNNER_TEMP/dronequiz.keystore" >> "$GITHUB_ENV"
          echo "DQ_KS_STORE_PASS=${{ secrets.DQ_KS_STORE_PASS }}" >> "$GITHUB_ENV"

      - name: Build release APK
        run: ./gradlew assembleRelease --stacktrace --no-daemon

      - name: Rename APK
        run: |
          mkdir -p dist
          cp app/build/outputs/apk/release/app-release.apk dist/DroneQuiz-${{ env.APP_VERSION_NAME }}.apk

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: DroneQuiz-${{ env.APP_VERSION_NAME }}
          path: dist/DroneQuiz-${{ env.APP_VERSION_NAME }}.apk

      - name: Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ env.APP_VERSION_TAG }}
          name: DroneQuiz ${{ env.APP_VERSION_TAG }}
          files: dist/DroneQuiz-${{ env.APP_VERSION_NAME }}.apk
          body: |
            题屿 v2.8.3 —— 模考题型构成重构 + 填空题原位输入 + 弹窗体系优化
            
            【模考 · 题型构成全面重构】
            - 「题型构成」移入高级选项，并新增「自动配比」开关：
              开启后按题库内各题型数量占比自动分配总题数；
            - 关闭自动后改为拖动比例滑杆（百分比）：拖动某题型，其余题型自动让出份额，
              实际题数 = 总题数 × 比例，实时显示「60% ≈ 30 题」；
            - 「题目数量」滑杆外置到考试设置区（总题数照旧可调）；
            - 高级选项展开后文字重叠的 bug 已修复；
            - 题型排序列表补充说明（显示当前题库实际参与排序的题型数）。
            
            【模考 · 答题卡】
            - 答题卡按题型分段展示：每段小标题显示「题型 · 题号范围 · 已答 x/y」，
              不再全部混排。
            
            【刷题 · 填空题交互重做】
            - 告别「第一空/第二空」分行输入：题干里的 ____ 空位处直接点入、原位输入，
              填完提交；提交后逐空红绿着色。
            
            【刷题 · 其他】
            - 解析展开动画回归：选完答案后判定结果与解析丝滑展开（v2.8.0 重构时丢失）；
            - 「提交，看参考答案」等按钮禁用态对比度调优，文字不再看不清；
            - 刷题配置页「分类」筛选移除（切换题库即换内容，维度冗余）；
            - 「全部题型」筛选 chips 凑满时自动换行，不再需要左右滑动。
            
            【弹窗体系】
            - 把手支持上拉过冲：上滑有 rubber-band 阻尼回弹，下滑关闭手感不变；
            - 「查看收款码」两态切换加推移动画（旧内容上移让位，不再硬切跳变）；
            - 打赏弹窗文案改为显示真实累计使用时长（如「累计使用 3 小时 12 分钟」）；
            - 修复叠层弹窗模糊互踩：关闭「CSV 模板」后，导入题库弹窗背景模糊不再消失；
            - 性能优化：弹窗背景模糊半径与动画时长降档、面板折射降档，减少掉帧。
            
            固定签名，可直接覆盖安装 v2.x
