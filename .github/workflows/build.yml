name: Build APK

on:
  push:
    branches: [ main ]
  workflow_dispatch:

permissions:
  contents: write

env:
  APP_VERSION_NAME: 2.5.1
  APP_VERSION_TAG: v2.5.1

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4

      # 固定签名：从 secrets 恢复 keystore，保证每个版本签名一致、可覆盖安装
      - name: Restore signing keystore
        run: |
          echo "${{ secrets.DQ_KEYSTORE_B64 }}" | base64 -d > "$RUNNER_TEMP/dronequiz.keystore"
          echo "DQ_KS_PATH=$RUNNER_TEMP/dronequiz.keystore" >> "$GITHUB_ENV"
          echo "DQ_KS_STORE_PASS=${{ secrets.DQ_KS_STORE_PASS }}" >> "$GITHUB_ENV"

      - name: Build release APK
        run: ./gradlew assembleRelease --stacktrace --no-daemon

      - name: Rename APK
        run: |
          mkdir -p dist
          cp app/build/outputs/apk/release/app-release.apk dist/DroneQuiz-${{ env.APP_VERSION_NAME }}.apk

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: DroneQuiz-${{ env.APP_VERSION_NAME }}
          path: dist/DroneQuiz-${{ env.APP_VERSION_NAME }}.apk

      - name: Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ env.APP_VERSION_TAG }}
          name: DroneQuiz ${{ env.APP_VERSION_TAG }}
          files: dist/DroneQuiz-${{ env.APP_VERSION_NAME }}.apk
          body: |
            无人机装调题库刷题 APP v2.5.1 —— 手感与视觉伪影专项修复

            【全局滚动回弹 v3】（重点，按社区标准实现重写）
            - 起手 1:1 绝对跟手：过冲曲线换用 CubicBezier(0.5,0.5,1,0.25)，
              修复此前一起手就"跟不上手"的钝感（旧曲线起手只有 0.55 倍）
            - 甩动无缝衔接：从过冲状态向内容侧甩动，过冲量按摩擦衰减滑行到零点，
              剩余速度原样交还列表继续滚动（iOS 同款，不再吞甩动）
            - 修复回弹甩过头：松手速度不再直接当弹簧初速度（旧实现会荡到另一侧）
            - 过冲上限改为容器高度（iOS 同款），软弹簧（StiffnessLow）自然回弹

            【底栏"方框/圆环"伪影】
            - 修复选中块按压鼓包超出栏体：56→78dp 的放大会在 64dp 栏外露出
              一圈带色散的透镜环，像被方框框住；现收敛到 62dp 栏内并减弱透镜
            - 移除底栏上的方形模糊层（弹窗打开时会在胶囊四周留下方框裁剪痕迹）

            【切题动画去伪影】
            - 移除 3D 旋转转盘效果：旋转会让卡片上下角被 Pager 视口裁剪
              （"上下切一刀"），且与玻璃 backdrop 采样叠加产生阴影感；
              保留轻微纵深缩放，干净无伪影

            【应用图标】
            - 全新图标（白色圆角卡 + 对勾 + 橙色线条，米色底）

            固定签名，可直接覆盖安装 v2.x
          overwrite_files: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
