name: Build APK

on:
  push:
    branches: [ main ]
    # 纯文档提交不触发构建：避免同版本号 tag 重复发布
    paths-ignore:
      - '**.md'
  workflow_dispatch:

permissions:
  contents: write

env:
  APP_VERSION_NAME: 2.9.3
  APP_VERSION_TAG: v2.9.3

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4

      # 固定签名：从 secrets 恢复 keystore，保证每个版本签名一致、可覆盖安装
      - name: Restore signing keystore
        run: |
          echo "${{ secrets.DQ_KEYSTORE_B64 }}" | base64 -d > "$RUNNER_TEMP/dronequiz.keystore"
          echo "DQ_KS_PATH=$RUNNER_TEMP/dronequiz.keystore" >> "$GITHUB_ENV"
          echo "DQ_KS_STORE_PASS=${{ secrets.DQ_KS_STORE_PASS }}" >> "$GITHUB_ENV"

      - name: Build release APK
        run: ./gradlew assembleRelease --stacktrace --no-daemon

      - name: Rename APK
        run: |
          mkdir -p dist
          cp app/build/outputs/apk/release/app-release.apk dist/TiYu-${{ env.APP_VERSION_NAME }}.apk

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: TiYu-${{ env.APP_VERSION_NAME }}
          path: dist/TiYu-${{ env.APP_VERSION_NAME }}.apk

      - name: Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ env.APP_VERSION_TAG }}
          name: 题屿 TiYu ${{ env.APP_VERSION_TAG }}
          files: dist/TiYu-${{ env.APP_VERSION_NAME }}.apk
          body: |
            题屿 v2.9.3 —— 果冻（Gooey）模式
            
            【新增 · 果冻模式】
            - 关闭「画面特效」不再退化为灰扑扑的平涂：现在整体切换为
              果冻模式——亚克力表面（只模糊、无折射）+ 液态 gooey 动效；
            - 底栏选中胶囊在标签间液态拖尾融合（快胶囊先行、慢尾巴 bounce 追随）；
            - 开关滑块拉伸融合、滑杆拇指速度拖尾、按钮按压液泡鼓包、
              弹窗过冲缩放入场、多选题勾选框与对勾液态融合弹出；
            - 文字与图标永远不进模糊层，全程锐利可读。
            
            【调整 · 特效三级体系】
            - 液态玻璃（开）→ 果冻（关）→ 安全平涂（仅崩溃兜底）三档；
            - 设置页文案改为「液态玻璃 / 果冻」二选一；
            - 玻璃模糊三档（轻透/适中/朦胧）在果冻模式下映射为亚克力模糊与
              gooey 融合强度；
            - 系统开启「减弱动画」时自动只保留亚克力表面、去掉果冻动效；
            - 上次启动异常触发安全模式时，无条件走无特效平涂，保证可用。
            
            【技术兼容】
            - API 31–32（Android 12/12L）：ColorMatrix 高对比斜坡近似阶跃；
            - API 33+（Android 13+）：AGSL 着色器精确 alpha 阶跃；
            - 渲染层构建异常一律自动回退无特效，绝不崩溃。
            
            固定签名，可直接覆盖安装 v2.x
