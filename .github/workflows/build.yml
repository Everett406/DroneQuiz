name: Build APK

on:
  push:
    branches: [ main ]
  workflow_dispatch:

permissions:
  contents: write

env:
  APP_VERSION_NAME: 2.7.4
  APP_VERSION_TAG: v2.7.4

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4

      # 固定签名：从 secrets 恢复 keystore，保证每个版本签名一致、可覆盖安装
      - name: Restore signing keystore
        run: |
          echo "${{ secrets.DQ_KEYSTORE_B64 }}" | base64 -d > "$RUNNER_TEMP/dronequiz.keystore"
          echo "DQ_KS_PATH=$RUNNER_TEMP/dronequiz.keystore" >> "$GITHUB_ENV"
          echo "DQ_KS_STORE_PASS=${{ secrets.DQ_KS_STORE_PASS }}" >> "$GITHUB_ENV"

      - name: Build release APK
        run: ./gradlew assembleRelease --stacktrace --no-daemon

      - name: Rename APK
        run: |
          mkdir -p dist
          cp app/build/outputs/apk/release/app-release.apk dist/DroneQuiz-${{ env.APP_VERSION_NAME }}.apk

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: DroneQuiz-${{ env.APP_VERSION_NAME }}
          path: dist/DroneQuiz-${{ env.APP_VERSION_NAME }}.apk

      - name: Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ env.APP_VERSION_TAG }}
          name: DroneQuiz ${{ env.APP_VERSION_TAG }}
          files: dist/DroneQuiz-${{ env.APP_VERSION_NAME }}.apk
          body: |
            题屿 v2.7.4 —— 打赏弹窗 + 模考历史回看/删除 + 双模式进度 + 成绩页流畅化

            【支持作者】(累计使用满 2 小时弹一次)
            - 用满 2 小时后会轻轻弹一次："喜欢题屿吗？可以请作者喝杯奶茶"；
            - 点"看看收款码"展示打赏码，一键保存到相册(Pictures/题屿)，随时可扫；
            - 点"以后别提醒我"则永久不再弹；
            - 考试中绝不打扰：正在模考时达标，会等你考完再出现

            【模考历史可回看 + 删除】
            - 考试页点击已完成的历史记录 → 直接重进该场模考成绩页
              (成绩从数据库重建，不再只限刚交卷那一场)；
            - 成绩页右上角新增浅色"三点"入口 → 删除本次模考记录；
            - 每周限删 2 次：确认弹窗实时显示本周剩余额度，用完会弹窗告知，
              下周一自动恢复 2 次

            【顺序/随机进度分开记】
            - 顺序与随机各有各的进度槽，互不覆盖：
              顺序模式接着顺序的上次位置，随机模式接着随机那轮的位置；
            - 配置页"将接续上次进度·第 N/M 题"提示随模式切换实时更新

            【模考成绩页滑动优化】
            - 错题解析展开后改为懒加载列表：只渲染屏幕内的条目，
              长列表滑动不再卡顿，且不再限制只显示前 20 条；
            - 列表滚到底自动衔接页面继续滚动

            【重新开始按钮重做】
            - 裸文字改为浅红底描边胶囊，更精致；
            - 点击先弹二次确认(说明将清空的进度)，不再一键直清，防误触

            固定签名，可直接覆盖安装 v2.x
