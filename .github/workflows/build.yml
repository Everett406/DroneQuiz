name: Build APK

on:
  push:
    branches: [ main ]
  workflow_dispatch:

permissions:
  contents: write

env:
  APP_VERSION_NAME: 2.4.0
  APP_VERSION_TAG: v2.4.0

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4

      # 固定签名：从 secrets 恢复 keystore，保证每个版本签名一致、可覆盖安装
      - name: Restore signing keystore
        run: |
          echo "${{ secrets.DQ_KEYSTORE_B64 }}" | base64 -d > "$RUNNER_TEMP/dronequiz.keystore"
          echo "DQ_KS_PATH=$RUNNER_TEMP/dronequiz.keystore" >> "$GITHUB_ENV"
          echo "DQ_KS_STORE_PASS=${{ secrets.DQ_KS_STORE_PASS }}" >> "$GITHUB_ENV"

      - name: Build release APK
        run: ./gradlew assembleRelease --stacktrace --no-daemon

      - name: Rename APK
        run: |
          mkdir -p dist
          cp app/build/outputs/apk/release/app-release.apk dist/DroneQuiz-${{ env.APP_VERSION_NAME }}.apk

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: DroneQuiz-${{ env.APP_VERSION_NAME }}
          path: dist/DroneQuiz-${{ env.APP_VERSION_NAME }}.apk

      - name: Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ env.APP_VERSION_TAG }}
          name: DroneQuiz ${{ env.APP_VERSION_TAG }}
          files: dist/DroneQuiz-${{ env.APP_VERSION_NAME }}.apk
          body: |
            无人机装调题库刷题 APP v2.4.0 —— 导航修复 + 刷题全新交互

            【底栏导航】（重点修复）
            - 彻底修复拖拽高亮块松手后不切页：根因是手势动画对象缓存了过期回调，
              切页判断用旧状态误判（表现为"高亮回去了、页面没回去"甚至无法回首页）
            - 现在拖拽松手直接同步切页，与单击行为完全一致；
              首页右上角进设置后也能正常点回首页

            【刷题全新交互】
            - 刷题 Tab 改为配置入口页：先选题型范围（全部/单选/判断）与分类，
              点"开始刷题"进入全屏刷题模式，页面不再空旷，也不再被底栏遮挡滑杆与切题按钮
            - 刷题进度实时保存：答题/翻页即落盘，中途退出不丢；
              配置页出现"继续上次"卡片，一键回到上次进度
            - 刷题记录改为应用级协程写入：答完立刻退出也不会再丢记录
            - 全屏刷题页支持超时兑底 + 失败重试 + 题库就绪自动重载

            【模考】
            - 题目卡片内容超长时可上下滚动，解析不再被压在屏幕外看不到
            - 放弃考试会删除该次记录："最近模考"不再残留进不去也删不掉的"进行中"条目
            - 未完成模考：可一键继续（含恢复已答题目与剩余时间）；也可点垃圾桶图标删除
            - 设置页"清空做题记录"现在会一并清空最近模考

            【液态玻璃弹窗】
            - 答题卡/确认弹窗打开时，背后内容真实模糊（iOS 风格），
              取代之前"糊一层黑色"的遮罩感
            - 面板透明度调低，折射质感更明显，不再像实色色块

            固定签名，可直接覆盖安装 v2.x
          overwrite_files: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
