name: Build APK

on:
  push:
    branches: [ main ]
    # 纯文档提交不触发构建：避免同版本号 tag 重复发布
    paths-ignore:
      - '**.md'
  workflow_dispatch:

permissions:
  contents: write

env:
  APP_VERSION_NAME: 2.8.1
  APP_VERSION_TAG: v2.8.1

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4

      # 固定签名：从 secrets 恢复 keystore，保证每个版本签名一致、可覆盖安装
      - name: Restore signing keystore
        run: |
          echo "${{ secrets.DQ_KEYSTORE_B64 }}" | base64 -d > "$RUNNER_TEMP/dronequiz.keystore"
          echo "DQ_KS_PATH=$RUNNER_TEMP/dronequiz.keystore" >> "$GITHUB_ENV"
          echo "DQ_KS_STORE_PASS=${{ secrets.DQ_KS_STORE_PASS }}" >> "$GITHUB_ENV"

      - name: Build release APK
        run: ./gradlew assembleRelease --stacktrace --no-daemon

      - name: Rename APK
        run: |
          mkdir -p dist
          cp app/build/outputs/apk/release/app-release.apk dist/DroneQuiz-${{ env.APP_VERSION_NAME }}.apk

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: DroneQuiz-${{ env.APP_VERSION_NAME }}
          path: dist/DroneQuiz-${{ env.APP_VERSION_NAME }}.apk

      - name: Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ env.APP_VERSION_TAG }}
          name: DroneQuiz ${{ env.APP_VERSION_TAG }}
          files: dist/DroneQuiz-${{ env.APP_VERSION_NAME }}.apk
          body: |
            题屿 v2.8.1 —— 修复 v2.8.0 升级启动崩溃（数据库迁移校验）
            
            致所有从 v2.8.0 之前版本升级后无法打开题屿的用户：非常抱歉！
            本版已彻底修复，直接覆盖安装即可，刷题进度、错题本、模考记录等所有学习数据完整保留。
            
            【问题原因】
            - v2.8.0 的数据库迁移（老用户升级时补建列）产出的表结构与新版校验规则不一致，
              导致从旧版本升级到 v2.8.0 的用户启动即崩溃；
            - 全新安装 v2.8.0 的用户不受影响。
            
            【本版修复】
            - 重写数据库迁移 v1→v2：改用「重建表 + 拷贝数据 + 补齐索引」标准方案，
              迁移结果与实体校验逐列逐索引一致；
            - 补建模考历史表缺失的日期索引；
            - 升级失败过（启动崩溃）的设备数据库未受损，装本版后会自动重新迁移。
            
            【v2.8.0 全部功能照常可用】
            - 多题库管理：设置 → 题库管理；首页副标题点击切换题库；
            - 导入题库：JSON / CSV 底部弹窗 + CSV 模板（丢给 AI 整理即可自制题库）；
            - 新题型：多选（手动提交、全对才算对）/ 填空（键盘避让、精确匹配）/ 简答（自评）；
            - 模考：题型分段组卷、高级选项拖拽排序、成绩按题型回看；
            - 错题特训按当前筛选；设置 → 关于可手动「请作者喝杯奶茶」。
            
            固定签名，可直接覆盖安装 v2.x
